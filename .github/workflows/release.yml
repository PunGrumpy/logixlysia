name: 🚀 Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    name: 🏎️ Release
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: 🛫 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🕺🏻 Prepare Repository
        run: git fetch --unshallow --tags
      - name: 🟢 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache-dependency-path: 'package.json'
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: 🌵 Cache Bun
        id: bun-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: 🔽 Install Dependencies
        run: bun install
      - name: 🔍 Lint, typecheck and test
        env:
          CI: true
        run: |
          bun run lint
          bun run typecheck
          bun run test
      - name: 🦊 Build Logixlysia
        run: bun run build --filter logixlysia
      # Two flavours of the same action. On ordinary pushes it only opens or
      # refreshes the "Version Packages" PR. Publishing runs solely on the
      # merge of that PR; letting every push attempt a publish made the job
      # fail with a 409 whenever npm still held the last version as staged.
      - name: 🎟️ Create or update the release PR
        if: ${{ !startsWith(github.event.head_commit.message, 'Version Packages') }}
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bun run changeset version
      - name: 🎟️ Publish to NPM
        id: changesets
        if: ${{ startsWith(github.event.head_commit.message, 'Version Packages') }}
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bun run changeset version
          publish-script: bun run changeset publish

  deploy-docs:
    name: ▲ Deploy docs
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    # Runs a third-party CLI, so no id-token and no write scopes.
    permissions:
      contents: read
    steps:
      - name: 🛫 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The CLI has a node shebang, so bunx runs it on Node.
      - name: 🟢 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: ▲ Deploy to Vercel
        run: bunx vercel@62.2.0 --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
