name: 🎬 Terminal Recording

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/elysia/**'
      - 'packages/logixlysia/**'
      - '.github/workflows/terminal-recording.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  record:
    name: 🎥 Record playground logs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: 🛫 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: 🌵 Cache Bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            **/node_modules
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}-
            ${{ runner.os }}-bun-
      - name: 🔽 Install Dependencies
        run: bun install
      - name: 🦊 Build Logixlysia
        run: bun run build --filter logixlysia
      - name: 📁 Prepare artifacts
        run: mkdir -p artifacts
      - name: 🎞️ Render tape
        # Every `Wait` in the tape is an assertion: vhs exits non-zero if the
        # playground never logs the expected line, so this step is a smoke test
        # that happens to produce a video.
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: apps/elysia/demo.tape
          install-fonts: true
      - name: 📤 Upload recording
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logixlysia-demo-${{ github.event.pull_request.number || github.run_id }}
          path: |
            artifacts/logixlysia-demo.gif
            artifacts/logixlysia-demo.mp4
            artifacts/logixlysia-demo.png
          if-no-files-found: error
          retention-days: 7
      - name: 📝 Write job summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## Playground terminal recording"
            echo
            echo "VHS drove \`apps/elysia\` in a real PTY and asserted every line below appeared:"
            echo
            echo "- start banner on \`localhost:3001\`"
            echo "- request context tree on \`/checkout\`"
            echo "- \`[REDACTED]\` on \`/auto-redact\`"
            echo "- \`WARNING\` on \`/status/404\`"
            echo "- red \`ERROR\` on \`/boom\`"
            echo "- AI token metrics on \`POST /chat\`"
            echo
            echo "[Download the GIF, MP4 and PNG](${ARTIFACT_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

  comment:
    name: 💬 Post recording to PR
    needs: record
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # actions:read lets `gh run download` fetch this run's artifact without a
      # third-party download action. `gh pr comment --attach` uploads to
      # user-content, which GitHub gates on write access to the repository, so
      # contents:write stays until a narrower permission is confirmed to work.
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No checkout in this job: it is the one holding a write token, so it
      # never runs repository code or third-party dependencies. That means no
      # git remote either, so point gh at the repo explicitly.
      GH_REPO: ${{ github.repository }}
      ARTIFACT_NAME: logixlysia-demo-${{ github.event.pull_request.number }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: 🔧 Install a gh that knows --attach
        env:
          GH_CLI_VERSION: '2.99.0'
        run: |
          set -euo pipefail
          # --attach landed in gh 2.99.0 and the runner image still ships an
          # older build. The version gate makes this a no-op once the image
          # catches up, at which point the whole step can go.
          current="$(gh --version | awk 'NR == 1 { print $3 }')"
          if [[ "$(printf '%s\n' "$GH_CLI_VERSION" "$current" | sort -V | head -1)" == "$GH_CLI_VERSION" ]]; then
            echo "gh $current already supports --attach"
            exit 0
          fi
          echo "Upgrading gh $current to $GH_CLI_VERSION"
          tarball="gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          gh release download "v${GH_CLI_VERSION}" --repo cli/cli --dir /tmp/gh \
            --pattern "$tarball" --pattern "gh_${GH_CLI_VERSION}_checksums.txt"
          (cd /tmp/gh && grep " ${tarball}$" "gh_${GH_CLI_VERSION}_checksums.txt" | sha256sum --check --strict -)
          tar -xzf "/tmp/gh/${tarball}" -C /tmp/gh
          echo "/tmp/gh/gh_${GH_CLI_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: ⬇️ Download recording artifact
        run: gh run download "${GITHUB_RUN_ID}" --name "${ARTIFACT_NAME}" --dir dist
      - name: 🗒️ Upsert recording comment
        run: |
          set -euo pipefail
          cat > body.md <<EOF
          ## 🎬 Playground terminal recording

          VHS drove \`apps/elysia\` at \`${HEAD_SHA:0:7}\` in a real PTY and asserted that logixlysia still prints:

          - the start banner, then a plain \`200\` request line
          - the per-request context tree on \`/checkout\`
          - \`[REDACTED]\` for the card, e-mail, IP and JWT on \`/auto-redact\`
          - \`WARNING\` on \`/status/404\` and a red \`ERROR\` on \`/boom\`
          - AI token metrics on \`POST /chat\`
          EOF
          # A single rejected file fails the whole command, so skip anything
          # oversized rather than lose the comment. GitHub caps images and GIFs
          # at 10MB, and video at 10MB on free plans (100MB on paid ones).
          # Files not referenced in the body are appended below it, GIF first.
          attachments=()
          attach() {
            local size
            size="$(stat -c %s "$1")"
            if (( size > 10 * 1024 * 1024 )); then
              echo "::warning::Skipped $(basename "$1") — $((size / 1048576))MB is over the 10MB attachment limit"
            else
              attachments+=(--attach "$1$2")
            fi
          }
          attach dist/logixlysia-demo.gif '#terminal recording'
          attach dist/logixlysia-demo.mp4 ''
          # --edit-last targets the last comment made by this token's user,
          # which is unambiguous only while this is the sole workflow that
          # comments as github-actions[bot].
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none \
            --body-file body.md "${attachments[@]}"
