name: 🤖 Validate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml

  code-quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint & Format
            command: bun run lint
          - name: Typecheck
            command: bun run typecheck
          - name: Test
            command: bun run test
    steps:
      - name: 🛫 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: 🌵 Cache Bun
        id: bun-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}-
            ${{ runner.os }}-bun-
      - name: 🔽 Install Dependencies
        run: bun install --frozen-lockfile
      - name: 🔍 Run ${{ matrix.name }}
        env:
          CI: true
        run: ${{ matrix.command }}

  elysia-2:
    name: Test on Elysia ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - next
          - rc
    steps:
      - name: 🛫 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: 🌵 Cache Bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}-
            ${{ runner.os }}-bun-
      - name: 🔽 Install Dependencies
        run: bun install --frozen-lockfile
      - name: 🏷️ Resolve Elysia ${{ matrix.tag }}
        id: elysia
        env:
          TAG: ${{ matrix.tag }}
        run: |
          version=$(npm view "elysia@$TAG" version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != next ] && [ "$version" = "$(npm view elysia@next version)" ]; then
            echo "Elysia $TAG is $version, the same as next"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 📦 Install Elysia ${{ steps.elysia.outputs.version }}
        if: steps.elysia.outputs.skip != 'true'
        working-directory: packages/logixlysia
        env:
          VERSION: ${{ steps.elysia.outputs.version }}
        run: bun add --dev "elysia@$VERSION" "exact-mirror@^1.2.7"
      - name: 🦊 Build Logixlysia
        if: steps.elysia.outputs.skip != 'true'
        run: bun run build --filter logixlysia
      # No typecheck: the package's types are written against Elysia 1.4.
      - name: 🔍 Run Test
        if: steps.elysia.outputs.skip != 'true'
        working-directory: packages/logixlysia
        env:
          CI: true
        run: bun test

  demo-smoke:
    name: Playground smoke
    runs-on: ubuntu-latest
    needs:
      - code-quality
    steps:
      - name: 🛫 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: 🌵 Cache Bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}-
            ${{ runner.os }}-bun-
      - name: 🔽 Install Dependencies
        run: bun install --frozen-lockfile
      - name: 🦊 Build Logixlysia
        run: bun run build --filter logixlysia
      - name: 🚀 Start playground
        working-directory: apps/elysia
        env:
          PORT: '3001'
        run: |
          bun run src/index.ts &
          echo $! > /tmp/elysia-demo.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Playground failed to start"
          exit 1
      - name: 🧪 Smoke demo routes
        run: |
          curl -sf http://localhost:3001/checkout
          curl -sf -X POST http://localhost:3001/chat
      - name: 🛑 Stop playground
        if: always()
        run: |
          if [ -f /tmp/elysia-demo.pid ]; then
            kill "$(cat /tmp/elysia-demo.pid)" 2>/dev/null || true
          fi
